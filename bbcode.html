<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>BBCode 修復工具：控制符修正與配對訂正</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f4f7fb;
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
    }
    .container {
      max-width: 950px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 20, 40, 0.06);
      padding: 2rem 2rem 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: all 0.2s ease;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.3px;
      margin-bottom: 0.2rem;
    }
    h1 span {
      background: #e9edf2;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 500;
      color: #334155;
      margin-left: 0.5rem;
    }
    .subtitle {
      color: #475569;
      font-size: 0.95rem;
      margin-top: -0.5rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      font-weight: 400;
      background: #f8fafc;
      border-radius: 0 8px 8px 0;
      line-height: 1.4;
    }
    .editor-panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    textarea {
      width: 100%;
      padding: 1rem 1.2rem;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      border: 1px solid #dce2e9;
      border-radius: 1.2rem;
      background: #fafbfc;
      resize: vertical;
      min-height: 180px;
      transition: 0.2s;
      color: #0f172a;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15), inset 0 1px 4px rgba(0,0,0,0.05);
      background: #ffffff;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      margin-top: 0.3rem;
    }
    .btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 0.7rem 1.5rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      color: #1e293b;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .btn-primary {
      background: #0f172a;
      border-color: #0f172a;
      color: white;
      box-shadow: 0 4px 8px rgba(15,23,42,0.2);
    }
    .btn-primary:hover {
      background: #1e293b;
      border-color: #1e293b;
    }
    .btn-secondary {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .btn-copy {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
    }
    .btn-copy:hover {
      background: #d1fae5;
      border-color: #6ee7b7;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .output-area {
      background: #f8fafc;
      border-radius: 1rem;
      border: 1px solid #e2e8f0;
      padding: 0.2rem;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      font-size: 0.85rem;
      color: #334155;
      background: #f1f5f9;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      margin-left: auto;
      align-items: center;
    }
    .badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.8rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .fix-note {
      color: #0f766e;
      background: #ccfbf1;
      padding: 0.3rem 0.9rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 0.2rem 0 0.5rem;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    @media (max-width: 550px) {
      .container {
        padding: 1.5rem;
      }
      .button-group {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div>
    <h1>
      📋 BBCode 修復器
      <span>v1.0</span>
    </h1>
    <div class="subtitle">
      自動修正錯誤的控制符（如 [b] [i] [u] [s] [color] [size] [url] …）並訂正巢狀配對錯誤
    </div>
  </div>

  <div class="editor-panel">
    <label>📝 原文貼上區</label>
    <textarea id="inputText" placeholder="在此貼上含有BBCode的原文...&#10;例如：[b]粗體[i]粗斜體[/b]斜體[/i] 或 [color=red]紅色[url=link]點我[/color][/url]">[b]這是粗體[i]粗斜體[/b]斜體修復[/i] 正常文字 [color=#ff0000]紅色[url=https://example.com]連結[/color]結束[/url] 還有未關閉的[b]標籤</textarea>
  </div>

  <div class="flex-row">
    <div class="button-group">
      <button class="btn btn-primary" id="fixBtn"><span>🔧</span> 修復 BBCode</button>
      <button class="btn btn-secondary" id="clearBtn"><span>🗑️</span> 清空</button>
      <button class="btn btn-secondary" id="sampleBtn"><span>📋</span> 載入範例</button>
    </div>
    <div class="stats" id="statsDisplay">
      <span>🏷️ 標籤數 <span id="tagCount">0</span></span>
      <span class="badge" id="statusBadge">等待輸入</span>
    </div>
  </div>

  <div class="editor-panel">
    <label>✅ 修正後輸出（已訂正配對與錯誤控制符）</label>
    <div class="output-area">
      <textarea id="outputText" placeholder="修復後的BBCode將顯示在這裡..." readonly style="min-height: 160px; background: #ffffff;"></textarea>
    </div>
    <div class="button-group" style="justify-content: flex-end;">
      <button class="btn btn-copy" id="copyBtn"><span>📋</span> 複製修正結果</button>
    </div>
    <div id="fixMessage" class="fix-note" style="margin-top: 0.2rem; display: none;"></div>
  </div>
  <hr>
  <div style="font-size:0.8rem; color:#64748b; text-align:center;">
    ⚡ 支援常見標籤：b, i, u, s, color, size, url, img, quote, code, list, * 等。自動修正未閉合、交叉配對與無效控制符。
  </div>
</div>

<script>
  (function() {
    // ----- 定義支援的 BBCode 標籤 (可自行擴充) -----
    // 格式：標籤名稱 -> { hasValue: true/false, closable: true/false }
    // closable 表示是否需要結束標籤 (大部分為true)
    const TAG_DEFINITIONS = {
      'b': { hasValue: false, closable: true },
      'i': { hasValue: false, closable: true },
      'u': { hasValue: false, closable: true },
      's': { hasValue: false, closable: true },
      'color': { hasValue: true, closable: true },
      'size': { hasValue: true, closable: true },
      'url': { hasValue: true, closable: true },
      'img': { hasValue: true, closable: false },  // img 通常不閉合，但有些人會寫 [img]url[/img]？常見為 [img]url[/img] 或 [img=url]？此處支援兩種。
      'quote': { hasValue: false, closable: true },
      'code': { hasValue: false, closable: true },
      'list': { hasValue: false, closable: true },
      '*': { hasValue: false, closable: false },    // 列表項目，通常不閉合 [*]文字
      'center': { hasValue: false, closable: true },
      'left': { hasValue: false, closable: true },
      'right': { hasValue: false, closable: true },
      'email': { hasValue: true, closable: true }
    };

    // 正則表達式：匹配 [標籤名=可選值] 或 [/標籤名] 或 [*] 等
    function buildTagRegex() {
      // 建立標籤名稱群組 (包含 *)
      const tagNames = Object.keys(TAG_DEFINITIONS).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      // 匹配開始標籤： [tag] 或 [tag=value] （value 不包含未轉義的 ']'）
      // 匹配結束標籤： [/tag]
      // 也匹配 [*] 視為獨立標籤
      return new RegExp(`\\[(${tagNames})(?:=([^\\]]*?))?\\]|\\[\\/(${tagNames})\\]|\\[\\*\\]`, 'gi');
    }

    // 解析文本為 token 陣列
    function parseTokens(text) {
      const regex = buildTagRegex();
      const tokens = [];
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(text)) !== null) {
        // 擷取前面的純文字
        if (match.index > lastIndex) {
          tokens.push({
            type: 'text',
            content: text.substring(lastIndex, match.index)
          });
        }

        const fullMatch = match[0];
        const startTagName = match[1] ? match[1].toLowerCase() : null;
        const startValue = match[2] !== undefined ? match[2] : null; // 可能為空字串
        const endTagName = match[3] ? match[3].toLowerCase() : null;

        if (fullMatch === '[*]') {
          tokens.push({
            type: 'tag',
            name: '*',
            raw: fullMatch,
            isClosing: false,
            hasValue: false,
            value: null
          });
        } else if (startTagName) {
          // 開始標籤 [tag] 或 [tag=value]
          const def = TAG_DEFINITIONS[startTagName];
          if (def) {
            tokens.push({
              type: 'tag',
              name: startTagName,
              raw: fullMatch,
              isClosing: false,
              hasValue: def.hasValue,
              value: startValue,
              closable: def.closable
            });
          } else {
            // 理論上不應該發生，因為正則已限制名稱；但當作文字處理
            tokens.push({ type: 'text', content: fullMatch });
          }
        } else if (endTagName) {
          // 結束標籤 [/tag]
          const def = TAG_DEFINITIONS[endTagName];
          if (def) {
            tokens.push({
              type: 'tag',
              name: endTagName,
              raw: fullMatch,
              isClosing: true,
              closable: def.closable
            });
          } else {
            tokens.push({ type: 'text', content: fullMatch });
          }
        }

        lastIndex = match.index + fullMatch.length;
      }

      // 剩餘文字
      if (lastIndex < text.length) {
        tokens.push({
          type: 'text',
          content: text.substring(lastIndex)
        });
      }

      return tokens;
    }

    // 修復核心：處理未閉合、交叉配對、無效標籤
    function repairTokens(tokens) {
      const stack = [];        // 存放尚未閉合的開始標籤 token (物件)
      const repaired = [];    // 最終輸出的 token 陣列 (可能插入修正標籤)
      let changes = 0;

      // 輔助函數：建立結束標籤 token
      function createClosingToken(name) {
        return {
          type: 'tag',
          name: name,
          raw: `[/${name}]`,
          isClosing: true,
          closable: true
        };
      }

      // 輔助函數：建立開始標籤 token (根據名稱與值)
      function createOpeningToken(name, value) {
        const def = TAG_DEFINITIONS[name];
        const hasValue = def ? def.hasValue : false;
        let raw;
        if (hasValue && value !== null && value !== undefined) {
          raw = `[${name}=${value}]`;
        } else {
          raw = `[${name}]`;
        }
        return {
          type: 'tag',
          name: name,
          raw: raw,
          isClosing: false,
          hasValue: hasValue,
          value: value,
          closable: def ? def.closable : true
        };
      }

      for (let i = 0; i < tokens.length; i++) {
        const token = tokens[i];

        if (token.type === 'text') {
          repaired.push(token);
          continue;
        }

        // 處理標籤
        if (!token.isClosing) {
          // 開始標籤
          const def = TAG_DEFINITIONS[token.name];
          // 若標籤不可閉合 (如 [*] 或 [img] 若設定為不可閉合)
          if (def && !def.closable) {
            // 直接輸出，不放入堆疊 (例如 [*] 或 [img] 若定義為不閉合)
            repaired.push(token);
            continue;
          }
          // 正常可閉合標籤：壓入堆疊
          stack.push(token);
          repaired.push(token);
        } else {
          // 結束標籤 [/tag]
          const closingName = token.name;
          const def = TAG_DEFINITIONS[closingName];
          // 如果是不可閉合的標籤卻出現結束標籤，視為多餘，忽略或跳過 (我們選擇忽略，並記錄)
          if (def && !def.closable) {
            // 多餘的結束標籤，跳過不輸出
            changes++;
            continue;
          }

          // 尋找堆疊中最近的可匹配開始標籤 (相同名稱)
          let matchedIndex = -1;
          for (let s = stack.length - 1; s >= 0; s--) {
            if (stack[s].name === closingName) {
              matchedIndex = s;
              break;
            }
          }

          if (matchedIndex !== -1) {
            // 找到匹配：但需要處理交叉配對。如果堆疊頂部不是該標籤，表示有未正確閉合的內部標籤。
            // 我們需自動閉合從棧頂到 matchedIndex 之間的所有標籤 (交叉修復)
            while (stack.length > 0 && stack[stack.length - 1].name !== closingName) {
              const unclosed = stack.pop();
              // 為這些未正常閉合的標籤補上結束標籤
              repaired.push(createClosingToken(unclosed.name));
              changes++;
            }
            // 現在棧頂應該是匹配的標籤
            if (stack.length > 0 && stack[stack.length - 1].name === closingName) {
              stack.pop(); // 正確匹配，彈出
              repaired.push(token); // 保留原始的結束標籤
            } else {
              // 邊緣情況：可能已空，補上結束標籤但仍輸出當前？不應該發生，但防禦
              repaired.push(token);
            }
          } else {
            // 堆疊中沒有對應的開始標籤：多餘的結束標籤，忽略 (或可選擇跳過)
            changes++;
            // 不輸出此結束標籤
            continue;
          }
        }
      }

      // 處理所有未閉合的標籤 (堆疊中剩餘的)
      while (stack.length > 0) {
        const unclosed = stack.pop();
        // 為其補上結束標籤 (但注意某些標籤可能原本就不應閉合？已在開始時過濾)
        if (TAG_DEFINITIONS[unclosed.name]?.closable) {
          repaired.push(createClosingToken(unclosed.name));
          changes++;
        } else {
          // 理論上不應有不可閉合標籤留在堆疊，但防禦
        }
      }

      return { tokens: repaired, changes };
    }

    // 將 tokens 組回字串
    function tokensToString(tokens) {
      return tokens.map(t => {
        if (t.type === 'text') return t.content;
        if (t.type === 'tag') return t.raw;
        return '';
      }).join('');
    }

    // 主要修復函式
    function fixBBCode(input) {
      if (!input || input.trim() === '') {
        return { output: '', changes: 0, tagCount: 0 };
      }
      const tokens = parseTokens(input);
      const tagTokens = tokens.filter(t => t.type === 'tag');
      const { tokens: repairedTokens, changes } = repairTokens(tokens);
      const output = tokensToString(repairedTokens);
      return { output, changes, tagCount: tagTokens.length };
    }

    // ----- UI 綁定 -----
    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const fixBtn = document.getElementById('fixBtn');
    const clearBtn = document.getElementById('clearBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const tagCountSpan = document.getElementById('tagCount');
    const statusBadge = document.getElementById('statusBadge');
    const fixMessageEl = document.getElementById('fixMessage');

    function updateStats(changes, tagCount) {
      tagCountSpan.textContent = tagCount;
      if (changes > 0) {
        statusBadge.textContent = `已修正 ${changes} 處`;
        statusBadge.style.background = '#fef9c3';
        statusBadge.style.color = '#854d0e';
      } else if (tagCount > 0 && changes === 0) {
        statusBadge.textContent = '結構正確';
        statusBadge.style.background = '#dcfce7';
        statusBadge.style.color = '#166534';
      } else if (tagCount === 0) {
        statusBadge.textContent = '無標籤';
        statusBadge.style.background = '#e2e8f0';
        statusBadge.style.color = '#334155';
      } else {
        statusBadge.textContent = '已處理';
      }
    }

    function performFix() {
      const rawText = inputEl.value;
      const { output, changes, tagCount } = fixBBCode(rawText);
      outputEl.value = output;
      updateStats(changes, tagCount);
      
      if (changes > 0) {
        fixMessageEl.style.display = 'flex';
        fixMessageEl.innerHTML = `✅ 已自動修正 ${changes} 處錯誤（交叉配對/未閉合/多餘標籤）`;
      } else if (tagCount > 0) {
        fixMessageEl.style.display = 'flex';
        fixMessageEl.innerHTML = `✨ BBCode 結構正確，無需修正。`;
      } else {
        fixMessageEl.style.display = 'none';
      }
    }

    // 初始化範例
    function loadSample() {
      inputEl.value = `[b]粗體文字[i]粗斜體[/b]斜體[/i] 正常 [color=#3366ff]藍色[url=https://openai.com]點擊[/color]這裡[/url] 未閉合[b]測試 [*]列表項1[*]列表項2[/list]`;
      performFix();
    }

    // 清空
    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      tagCountSpan.textContent = '0';
      statusBadge.textContent = '等待輸入';
      statusBadge.style.background = '#e2e8f0';
      statusBadge.style.color = '#334155';
      fixMessageEl.style.display = 'none';
    }

    // 複製結果
    async function copyResult() {
      const text = outputEl.value;
      if (!text) {
        alert('沒有修復結果可複製');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span>✅</span> 已複製';
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      } catch (err) {
        alert('複製失敗，請手動選取複製');
      }
    }

    // 事件監聽
    fixBtn.addEventListener('click', performFix);
    clearBtn.addEventListener('click', clearAll);
    sampleBtn.addEventListener('click', loadSample);
    copyBtn.addEventListener('click', copyResult);

    // 可選：即時顯示統計 (僅標籤數量)
    inputEl.addEventListener('input', function() {
      const tokens = parseTokens(inputEl.value);
      const tagTokens = tokens.filter(t => t.type === 'tag');
      tagCountSpan.textContent = tagTokens.length;
      if (tagTokens.length === 0) {
        statusBadge.textContent = '無標籤';
        statusBadge.style.background = '#e2e8f0';
        statusBadge.style.color = '#334155';
      } else {
        statusBadge.textContent = '尚未修復';
        statusBadge.style.background = '#dbeafe';
        statusBadge.style.color = '#1e40af';
      }
      fixMessageEl.style.display = 'none';
    });

    // 頁面載入時自動執行一次範例展示
    window.addEventListener('DOMContentLoaded', () => {
      // 預設已有一點內容在 textarea 中，直接修復顯示
      performFix();
    });
  })();
</script>
</body>
</html>
