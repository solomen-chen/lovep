<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上帝向亞伯拉罕所起的誓</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.8;
            background-color: #f7f5f0;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 45px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.8rem;
            color: #8b0000;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0d5c5;
            padding-bottom: 15px;
        }

        .intro {
            font-size: 1.15rem;
            margin-bottom: 25px;
            color: #444;
        }

        .quote {
            background: #f9f4eb;
            border-left: 5px solid #c9a227;
            padding: 18px 22px;
            margin: 25px 0;
            font-size: 1.1rem;
            color: #5a3e1b;
            border-radius: 0 8px 8px 0;
        }

        h2 {
            font-size: 1.35rem;
            color: #6b3a1f;
            margin: 35px 0 15px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #d4c4a8;
        }

        .point {
            margin-bottom: 28px;
        }

        .point-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 8px;
        }

        .bible-ref {
            color: #8b4513;
            font-weight: 600;
            margin: 10px 0 5px;
        }

        .bible-text {
            background: #faf8f4;
            padding: 12px 16px;
            border-radius: 6px;
            font-style: italic;
            color: #555;
            margin-top: 6px;
        }

        .footer-note {
            margin-top: 40px;
            text-align: center;
            font-size: 0.95rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>上帝向亞伯拉罕所起的誓</h1>

        <p class="intro">
            亞伯拉罕獻以撒之後，上帝藉著使者宣告：
        </p>

        <div class="quote">
            「你既行了這事，不留下你的兒子，就是你獨生的兒子，我便指著自己起誓說……」
        </div>

        <h2>起誓的內容</h2>

        <div class="point">
            <div class="point-title">(1) 上帝應許亞伯拉罕要成為大國，並且他的後裔要非常眾多。</div>
            <div class="bible-ref">《創世記》12:2：</div>
            <div class="bible-text">
                「我必叫你成為大國。我必賜福給你，叫你的名為大；你也要叫別人得福。」
            </div>
        </div>

        <div class="point">
            <div class="point-title">(2) 上帝也應許把迦南地賜給亞伯拉罕的後裔。</div>
            <div class="bible-ref">《創世記》12:7：</div>
            <div class="bible-text">
                「我要把這地賜給你的後裔。」
            </div>
        </div>

        <div class="point">
            <div class="point-title">(3) 萬國要因亞伯拉罕的「後裔」得福</div>
            <div class="bible-ref">《創世記》22:18：</div>
            <div class="bible-text">
                「並且地上萬國都必因你的後裔得福。」
            </div>
        </div>

        
    </div>
</body>
</html>
